name: Nightly rankings

on:
  schedule:
    # 07:00 UTC is 2:00 AM Eastern Standard Time and 3:00 AM Eastern Daylight Time.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-rankings
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish Top Rated and the Stock Screener
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/publish-top-rated.ts
      - name: Save the dataset when it changes
        run: |
          git add src/data/top-rated.json src/data/score-history.json
          if git diff --cached --quiet; then
            echo "Dataset unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish the nightly Top Rated and Stock Screener dataset."
          git push
